name: Importar radio

on:
  push:
    branches: [main]
    paths: ["tools/fetch_radio.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q gdown
      - name: Descargar y convertir
        run: python3 tools/fetch_radio.py 2>&1 | tee radio.log
      - name: Subir al repositorio
        run: |
          exec > >(tee push.log) 2>&1
          set -x
          rm -rf radio_src
          du -sh assets/audio/radio || true
          find assets/audio/radio -size +50M -print
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add assets/audio/radio data/radio.json docs/CREDITOS_MUSICA.txt 2>/dev/null || git add assets/audio/radio data/radio.json
          git commit -m "Radio: canciones, anuncios y sintonías desde Drive" || echo "sin cambios"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publicar registro en la rama radio-status
        if: always()
        run: |
          mkdir -p /tmp/rl && cp radio.log push.log /tmp/rl/ 2>/dev/null || true
          cd /tmp/rl && git init -q && git checkout -q -b radio-status
          git config user.name "ci-bot" && git config user.email "ci-bot@users.noreply.github.com"
          tail -c 200000 radio.log > r.log 2>/dev/null; mv r.log radio.log 2>/dev/null || true
          git add . && git commit -qm "registro radio" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" radio-status
