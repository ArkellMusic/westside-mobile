name: Importar radio

on:
  push:
    branches: [main]
    paths: ["tools/fetch_radio.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q gdown
      - name: Descargar y convertir
        run: python3 tools/fetch_radio.py 2>&1 | tee radio.log
      - name: Subir al repositorio
        run: |
          du -sh assets/audio/radio || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add assets/audio/radio data/radio.json docs/CREDITOS_MUSICA.txt 2>/dev/null || git add assets/audio/radio data/radio.json
          git commit -m "Radio: canciones, anuncios y sintonías desde Drive" || echo "sin cambios"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radio-log
          path: radio.log
