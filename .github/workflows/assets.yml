name: Descargar texturas CC0

on:
  push:
    branches: [main]
    paths: ["tools/assets_manifest.json", "tools/fetch_assets.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Descargar de Poly Haven
        run: python3 tools/fetch_assets.py 2>&1 | tee fetch.log
      - name: Subir al repositorio
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add assets/textures assets/sky assets/props assets/CREDITOS.md
          git commit -m "Texturas PBR y cielos HDRI CC0 de Poly Haven" || echo "sin cambios"
          git pull --rebase origin main
          git push origin HEAD:main
